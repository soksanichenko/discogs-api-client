[project]
name = "discogs-api-client"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "oauthlib==4.0.0",
    "python-dotenv==1.2.4",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
    "PyYAML==6.0.3",
]

[tool.setuptools.packages.find]
where = ["sources"]

[tool.ruff.format]
quote-style = "single"
