---
infisical_project_id: "286db07f-4dba-4ca9-a515-f017d77b8bf1"
infisical_path: "/hosts/zelgray-work"

docker_network: "active"
docker_volumes_directory: "/opt/docker"
redis_container_name: "redis"
# The shared Redis (infra's redis role) requires a password; urlencode it
# (and '/', which urlencode keeps) so any character is safe in the URL.
discogs_api_client_redis_url: >-
  redis://:{{ infisical_secrets.secrets['redis-password'] | urlencode | replace('/', '%2F') }}@{{ redis_container_name }}:6379
nginx_docker_container_name: "nginx-server"
nginx_confd_path: "{{ docker_volumes_directory }}/nginx/conf.d"
nginx_custom_upstream_path: "{{ nginx_confd_path }}/custom-upstream"

discogs_api_client_nginx_custom_locations_path: "{{ nginx_confd_path }}/zelgray.work-custom-locations"

discogs_api_client_consumer_key: "{{ infisical_secrets.secrets['discogs-consumer-key'] }}"
discogs_api_client_consumer_secret: "{{ infisical_secrets.secrets['discogs-consumer-secret'] }}"
discogs_api_client_secret_key: "{{ infisical_secrets.secrets['discogs-secret-key'] }}"
discogs_api_client_base_url: "https://zelgray.work/discogs"
...
